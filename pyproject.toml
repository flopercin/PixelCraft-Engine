[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelcraft"
version = "0.1.0"
description = "A programmatic pixel art and animation engine designed for AI Agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pillow>=9.0.0",
]

[project.scripts]
pixelcraft = "pixelcraft.cli:main"
